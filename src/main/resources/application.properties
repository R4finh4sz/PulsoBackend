spring.application.name=pulsoescolar-api
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=${MAILERSEND_SMTP_HOST:smtp.mailersend.net}
spring.mail.port=${MAILERSEND_SMTP_PORT:587}
spring.mail.username=${MAILERSEND_SMTP_USERNAME:}
spring.mail.password=${MAILERSEND_SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAILERSEND_FROM_EMAIL:}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.session-ttl=${JWT_SESSION_TTL:30m}
