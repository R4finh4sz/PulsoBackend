spring.application.name=pulsoescolar-api
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

management.endpoints.web.exposure.include=health
management.metrics.tags.application=${spring.application.name}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:5173}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.user=${DB_MIGRATION_USERNAME:${DB_USERNAME}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM_EMAIL:}
app.auth.jwt-secret=${JWT_SECRET}
app.auth.session-ttl=${JWT_SESSION_TTL:50m}
app.auth.refresh-ttl=${JWT_REFRESH_TTL:10m}
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:120}
app.rate-limit.window=${RATE_LIMIT_WINDOW:1m}
app.rate-limit.auth-max-requests=${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
app.rate-limit.auth-window=${AUTH_RATE_LIMIT_WINDOW:1m}
